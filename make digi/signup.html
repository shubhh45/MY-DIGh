<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Create your DigiLocker account to securely store and manage your digital documents.">
  <title>DigiLocker — Create Account</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div class="auth-page">
    <!-- Hero -->
    <div class="auth-hero">
      <div class="auth-hero-content">
        <div class="logo-large">chodu<span>Locker</span></div>
        <p class="tagline">Join millions of Indians going paperless</p>
        <ul class="features-list">
          <li><span class="icon"><i class="fas fa-clock"></i></span> Setup in under 2 minutes</li>
          <li><span class="icon"><i class="fas fa-id-card"></i></span> Link your Aadhaar for verification</li>
          <li><span class="icon"><i class="fas fa-folder-open"></i></span> Store up to 1 GB of documents free</li>
          <li><span class="icon"><i class="fas fa-lock"></i></span> Bank-grade security & encryption</li>
        </ul>
      </div>
    </div>

    <!-- Signup Form -->
    <div class="auth-form-section">
      <div class="auth-form-wrapper">
        <h1 class="form-title">Create Account</h1>
        <p class="form-subtitle">Start your paperless journey today</p>

        <form id="signupForm" autocomplete="off">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="fullName" placeholder="Enter your full name" required>
              <i class="fas fa-user input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="aadhaarNumber">Aadhaar Number</label>
            <div class="input-wrapper">
              <input type="text" id="aadhaarNumber" placeholder="XXXX XXXX XXXX" maxlength="14" required>
              <i class="fas fa-fingerprint input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="email" placeholder="you@example.com" required>
              <i class="fas fa-envelope input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <div class="input-wrapper">
              <input type="tel" id="phone" placeholder="+91 XXXXX XXXXX" maxlength="15" required>
              <i class="fas fa-phone input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="signupUsername">Username</label>
            <div class="input-wrapper">
              <input type="text" id="signupUsername" placeholder="Choose a username" required>
              <i class="fas fa-at input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="signupPassword" placeholder="Create a strong password" required minlength="6">
              <i class="fas fa-lock input-icon"></i>
              <span class="toggle-password" onclick="togglePassword('signupPassword', this)">
                <i class="fas fa-eye"></i>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
              <i class="fas fa-lock input-icon"></i>
            </div>
          </div>

          <div style="margin-bottom: 20px;">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="agreeTerms" required>
              I agree to the <a href="#" style="color:var(--blue-500); font-weight:500;">Terms & Conditions</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary"
            style="width:100%; justify-content:center; font-size:1rem; padding:15px;">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>

        <p class="form-footer">
          Already have an account? <a href="index.html">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="js/app.js"></script>
  <script>
    // Format Aadhaar as XXXX XXXX XXXX
    document.getElementById('aadhaarNumber').addEventListener('input', function (e) {
      let val = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
      if (val.length > 12) val = val.slice(0, 12);
      e.target.value = val.replace(/(\d{4})(?=\d)/g, '$1 ');
    });

    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('fullName').value.trim();
      const aadhaar = document.getElementById('aadhaarNumber').value.replace(/\s/g, '');
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
      if (aadhaar.length !== 12) { showToast('Aadhaar number must be 12 digits', 'error'); return; }

      if (signup({ name, aadhaar, email, phone, username, password })) {
        showToast('Account created! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        showToast('Username already exists', 'error');
      }
    });
    if (getCurrentUser()) window.location.href = 'dashboard.html';
  </script>
</body>

</html>
